[package]
name = "angpao"
version = "0.1.0"
description = "Onchain angpao (red packet): split SOL into lucky or equal packets that friends claim"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "angpao"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"

[dev-dependencies]
litesvm = "0.18.2"
solana-sdk = "4.0.1"
bincode = "1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
