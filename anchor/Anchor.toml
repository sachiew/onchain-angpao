[toolchain]
anchor_version = "1.2.2"

[features]
resolution = true
skip-lint = false

# Solana note: the program ID is the public key of `target/deploy/angpao-keypair.json`.
# Forking? Generate your own keypair, then update this line AND `declare_id!` in lib.rs
# (`anchor keys sync` does both). See README → "Fork guide".
[programs.localnet]
angpao = "BQGTxcw15XCWThc3qt1gMs6GRYQscXBTSfoEEGZuXsmd"

[programs.devnet]
angpao = "BQGTxcw15XCWThc3qt1gMs6GRYQscXBTSfoEEGZuXsmd"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

[hooks]
