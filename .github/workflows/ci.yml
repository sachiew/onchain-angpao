name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  anchor:
    name: Anchor build & tests
    runs-on: ubuntu-latest
    env:
      ANCHOR_VERSION: 1.2.2
      NO_DNA: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libudev-dev libssl-dev
      - name: Rust toolchain (from anchor/rust-toolchain.toml)
        working-directory: anchor
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
            ~/.cache/solana
            anchor/target
          key: anchor-${{ env.ANCHOR_VERSION }}-${{ hashFiles('anchor/Cargo.lock', 'anchor/rust-toolchain.toml') }}
          restore-keys: anchor-${{ env.ANCHOR_VERSION }}-
      - name: Install Solana CLI
        run: |
          [ -x ~/.local/share/solana/install/active_release/bin/solana ] || sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor CLI
        run: |
          anchor --version 2>/dev/null | grep -q "$ANCHOR_VERSION" || \
            cargo install --git https://github.com/otter-sec/anchor --tag v$ANCHOR_VERSION anchor-cli --locked --force
      - name: Program keypair for CI builds
        working-directory: anchor
        # CI needs *a* keypair to build; tests load the program at the declared ID, so any key works.
        run: mkdir -p target/deploy && [ -f target/deploy/angpao-keypair.json ] || solana-keygen new --no-bip39-passphrase -s -o target/deploy/angpao-keypair.json
      - name: Build
        working-directory: anchor
        run: anchor build --ignore-keys
      - name: Test
        working-directory: anchor
        run: cargo test -- --test-threads=4
